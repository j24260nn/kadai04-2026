<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>演習課題4-1：九九の表</title>
</head>
<body>
  <script>
    //九九の表をコンソールに表示する
    for (let i = 1; i <=9; i++) {
      let line = "";
      for (let j = 1; j<= 9; j++) {
        line += i * j + "\t";
      }
    console.log(line);
    }
  </script>
  
</body>
</html>
